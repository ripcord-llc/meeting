<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>

<body style="height: 100%">
  <div>
    <button id="open-modal">Open Modal</button>
    <button id="destroy">Destroy</button>
  </div>
  <script src="/dist/index.umd.js"></script>
  <script>
    const button = document.getElementById('open-modal')
    const destroyButton = document.getElementById('destroy')

    Ripcord.INTERNAL_USE_ONLY_setConfig({
      CLIENT_URL: "http://localhost:8081",
      API_URL: "http://localhost:3000"
    })

    const instance = new Ripcord({ el: button, routingId: "wvsxXrmRks-_ezdau7qn3" })

    window.addEventListener("load", () => {
      instance.open()
    })

    destroyButton.addEventListener('click', () => {
      instance.destroy()
    })
  </script>
</body>

</html>
